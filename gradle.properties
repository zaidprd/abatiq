# Gradle JVM settings
# Heap naik dari 2g -> 3g agar KSP + Compose compiler + Room codegen
# tidak ke-trigger GC di tengah pada mesin dengan RAM terbatas.
org.gradle.jvmargs=-Xmx3g -Xms512m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# AndroidX
android.useAndroidX=true
android.enableJetifier=false

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# Performance
org.gradle.parallel=true
org.gradle.caching=true
# Project ini cuma punya satu modul (:app), jadi configureondemand aman
# dan mempercepat Gradle melewati task yang tidak berubah.
org.gradle.configureondemand=true
# Gradle daemon default-nya true, tapi kita eksplisitkan.
org.gradle.daemon=true

# Non-transitive R classes for faster builds
android.nonTransitiveRClass=true

# AGP 8.6+ : resource IDs di-generate sebagai non-final sehingga
# incremental compile resource lebih ringan.
android.nonFinalResIds=true

# Enable KSP 2 (faster Room/codegen)
ksp.useKSP2=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
